<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Installation of a pipe rack — AR viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0e1116; color: #e8edf4; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(to bottom, rgba(14,17,22,.92), rgba(14,17,22,0));
  pointer-events: none;
}
header a, header .title { pointer-events: auto; }
header a { color: #9db0c8; text-decoration: none; font-size: 14px; }
header .title { font-weight: 650; font-size: 16px; letter-spacing: .01em; }
model-viewer { width: 100%; height: 100%; --poster-color: #0e1116; }
.hint {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  margin: 0; padding: 16px 16px calc(44px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(14,17,22,.92), rgba(14,17,22,0));
  font-size: 13px; color: #b7c4d4; text-align: center;
}
.progress {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(240px, 70vw); height: 4px; border-radius: 4px; background: #243044; overflow: hidden;
}
.progress .bar { height: 100%; width: 0%; background: #7eb6ff; transition: width .15s linear; }
.arbtn { position:absolute; left:50%; bottom:120px; white-space:nowrap; transform:translateX(-50%); z-index:3; padding:14px 22px; border:0; border-radius:28px; background:#7eb6ff; color:#0e1116; font-weight:700; font-size:16px; }
.fallback { position:fixed; left:50%; bottom:184px; transform:translateX(-50%); z-index:3; display:none; padding:12px 18px; border-radius:24px; background:#2b6cb0; color:#fff; font-weight:600; text-decoration:none; font-size:15px; white-space:nowrap; }
</style>
</head>
<body>
  <header>
    <a href="./">All models</a>
    <div class="title">Installation of a pipe rack</div>
  </header>
  <model-viewer
    id="mv"
    src="model2.glb"
    alt="Installation of a pipe rack"
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    environment-image="neutral"
    exposure="0.9"
    auto-rotate
    auto-rotate-delay="3000"
    loading="eager"
    reveal="auto"
  >
    <button slot="ar-button" class="arbtn">View in your space (AR)</button>
    <div class="progress" slot="progress-bar"><div class="bar" id="bar"></div></div>
  </model-viewer>
  <p class="hint">Tap “View in your space” to place the model (real size, pinch to scale). No AR button? Open this link in Chrome (Android) or Safari (iPhone), not inside the QR scanner app.</p>
  <script>
    const mv = document.getElementById('mv');
    const bar = document.getElementById('bar');
    mv.addEventListener('progress', (e) => {
      const p = e.detail && e.detail.totalProgress != null ? e.detail.totalProgress : 0;
      bar.style.width = Math.round(p * 100) + '%';
    });
    mv.addEventListener('load', () => {
      const el = document.querySelector('.progress');
      if (el) el.style.display = 'none';
    });
    mv.addEventListener('error', (e) => {
      document.querySelector('.hint').textContent = 'The model failed to load. Check the GLB URL and try again.';
    });
  </script>
  <a id="sv" class="fallback" href="#">Open in Android AR (Scene Viewer)</a>
  <script>
    (function(){
      var glb = new URL(document.getElementById('mv').getAttribute('src'), location.href).href;
      var title = document.title.split(' — ')[0];
      var q = 'file=' + encodeURIComponent(glb) + '&mode=ar_preferred&title=' + encodeURIComponent(title);
      var a = document.getElementById('sv');
      a.href = 'intent://arvr.google.com/scene-viewer/1.0?' + q + '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=' + encodeURIComponent('https://developers.google.com/ar') + ';end;';
      if (/Android/i.test(navigator.userAgent)) a.style.display = 'block';
    })();
  </script>
</body>
</html>
